name: keyvan
profile: keyvan
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  keyvan:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    stags:
      +materialized: table
      +schema: stg
    marts:
      +materialized: table
      +schema: marts
