name: keyvan

profile: keyvan

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  keyvan:
    +schema: raw

models:
  keyvan:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    stags:
      +materialized: table
      +schema: stg
    marts:
      +materialized: table
      +schema: marts
